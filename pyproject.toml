[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundstate-hearth"
version = "0.1.0"
description = "HEARTH — Buyer-Side Real Estate Intelligence Platform (ships with the ORACLE review engine)"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
    { name = "Dr. Joseph Wilde", email = "jnwilde@pm.me" },
    { name = "BoundState AI" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "anthropic>=0.80.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "PyMuPDF>=1.24.0",
    "jsonschema>=4.20.0",
    "cryptography>=42.0.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.9.0",
    "python-docx>=1.1.2",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
voice = [
    "faster-whisper>=1.0",
]

[project.scripts]
dude = "dude.cli:main"
hearth = "hearth.cli:main"
oracle = "oracle.cli:main"
sentinel-tocr = "sentinel.tocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oracle", "sentinel", "hearth", "dude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
