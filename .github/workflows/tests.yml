name: tests

# Three gates on every push and PR:
#   pytest         — full suite (incl. the golden-case consensus harness) with
#                    a coverage floor. No API keys: all oracle calls are
#                    mocked, so a red run always means a behavioral
#                    regression, never a vendor outage.
#   boot-smoke     — the platform must actually boot: start uvicorn, probe
#                    /health. Tests-green-but-won't-start is the gap this
#                    closes.
#   frontend-build — the Next.js workspace must compile and build.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run test suite with coverage floor
        # Floor recalibrated 2026-07-29 at 46% (measured: 47%) after HEARTH's
        # removal changed the denominator: ~2.1K well-covered statements left,
        # so the ratio dropped with zero loss of ORACLE coverage. Raise-only
        # discipline still applies from this new baseline — never lower it to
        # make a PR pass. Known debt remains sentinel/ (0%, ~2.6K statements);
        # excluding it, the repo sits at ~69%.
        run: >
          python -m pytest tests/ -v
          --cov=oracle --cov=pipeline --cov=sentinel --cov=server
          --cov-report=term --cov-fail-under=46

  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot server and probe health endpoint
        run: |
          python -m uvicorn server:app --port 8123 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8123/health
          kill "$SERVER_PID"

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        # Dummy key: the API proxy route asserts the var exists at
        # page-data-collection time. No real secret is needed to build.
        env:
          ORACLE_API_KEY: ci-build-dummy
        run: npm run build
